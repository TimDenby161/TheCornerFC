<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- GitHub Pages can't send security headers, so the policy is here. Scripts: only this site's
     assets (no inline script or onerror handlers). Connections: this site, and Supabase for the
     owner-only FPL and EFL Fantasy data and the My FPL team lock-in. Images: this site and flagcdn (flags; no badges, logos or photos from
     API-Football's media host). No inline styles: app.js sets computed styles through the DOM (applyStyles). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://flagcdn.com; connect-src 'self' https://bookkurhdabdeccckjbn.supabase.co; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>The Corner FC</title>
<meta name="description" content="Club strength ratings, projected scores and model win/draw/loss probabilities.">
<!-- Link previews. One card for the whole site: addresses after # never reach the service that builds it -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Corner FC">
<meta property="og:title" content="The Corner FC">
<meta property="og:description" content="Club strength ratings, projected scores and model win/draw/loss probabilities.">
<meta property="og:url" content="https://thecornerfc.com/">
<meta property="og:image" content="https://thecornerfc.com/icon-512.png">
<meta property="og:image:alt" content="The Corner FC">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corner FC">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/styles.css">

</head>
<body data-tab="table" class="booting">
<a class="skip-link" href="#main" id="skip-link">Skip to content</a>

<header>
  <div class="app-bar">
    <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="main-menu">&#9776;</button>
    <p class="brand"><span class="brand-mark" aria-hidden="true"></span><span>The Corner FC</span></p>
    <h1 class="app-title" id="app-title">Clubs</h1>
    <button type="button" class="account-btn" id="account-btn" aria-haspopup="dialog">Sign in</button>
  </div>
  <nav class="tabs" id="main-menu" aria-label="Main">
    <button type="button" data-tab="table" data-view="clubs" aria-current="page">Clubs</button>
    <button type="button" data-tab="table" data-view="players">Players</button>
    <button type="button" data-tab="leagues">Leagues</button>
    <button type="button" data-tab="nations">Nations</button>
    <button type="button" data-tab="matches">Matches</button>
    <button type="button" data-tab="stats">Stats</button>
    <button type="button" data-tab="lineups">Line-up record</button>
    <button type="button" data-tab="tips">Model vs Market</button>
    <button type="button" data-tab="bets">Paper Simulation</button>
    <button type="button" data-tab="fpl" id="fpl-tab" hidden>FPL</button>
    <button type="button" data-tab="myteam" id="myteam-tab" hidden>My FPL team</button>
    <button type="button" data-tab="efl" id="efl-tab" hidden>EFL Fantasy</button>
    <label class="theme-pick">Theme
      <select id="theme-select">
        <option value="">Device</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </nav>
  <div class="menu-backdrop" id="menu-backdrop" hidden></div>
</header>

<main id="main" tabindex="-1">
  <div class="tab-head" id="tab-head" hidden>
    <p class="tab-intro" id="tab-intro"></p>
    <details class="tab-key" id="tab-key"><summary>What the numbers mean</summary><dl id="tab-key-list"></dl></details>
  </div>
  <div class="empty-state" id="boot-status" role="status">Loading…</div>
  <section class="panel" data-tab="matches" data-active="false">
    <div class="match-bar">
      <div id="match-side">
        <div class="side-stick"><div class="filters-wrap side-filters" id="match-filters"></div></div>
      </div>
      <div class="secondary-filters">
        <button type="button" class="nav-btn" id="date-prev" aria-label="Previous day">&#8249;</button>
        <input type="date" id="date-input" class="date-input" aria-label="Match date">
        <select id="round-select" class="date-input" aria-label="Round" hidden></select>
        <button type="button" class="nav-btn" id="date-next" aria-label="Next day">&#8250;</button>
        <button type="button" class="nav-btn today-btn" id="date-today">Today</button>
      </div>
    </div>
    <div id="matches-list"></div>
  </section>

  <section class="panel" data-tab="table" data-active="true">
    <div id="table-side">
      <div class="side-stick">
        <div class="more-panel" id="more-panel">
        <div id="exclude-filter" hidden></div>
        <div id="range-filter" hidden></div>
        <div id="age-filter" hidden>
          <div class="age-head"><span>Age</span><span id="age-label"></span></div>
          <div class="age-slider">
            <div class="age-track"><div class="age-fill" id="age-fill"></div></div>
            <input type="range" id="age-min" aria-label="Youngest age">
            <input type="range" id="age-max" aria-label="Oldest age">
          </div>
        </div>
        <div id="pos-filter" hidden></div>
        <div id="who-filter" hidden>
          <div class="pos-head"><span>Club &amp; nationality</span>
            <button type="button" class="pos-clear" data-who-clear hidden>Clear</button></div>
          <div class="who-field">
            <input type="search" id="club-input" class="table-search who-input" data-kind="club" role="combobox"
                   aria-expanded="false" aria-controls="club-menu" aria-autocomplete="list"
                   placeholder="Add a club" aria-label="Filter by club" autocomplete="off">
            <div class="who-menu" id="club-menu" role="listbox" aria-label="Clubs" hidden></div>
          </div>
          <div class="who-field">
            <input type="search" id="nat-input" class="table-search who-input" data-kind="nat" role="combobox"
                   aria-expanded="false" aria-controls="nat-menu" aria-autocomplete="list"
                   placeholder="Add a nationality" aria-label="Filter by nationality" autocomplete="off">
            <div class="who-menu" id="nat-menu" role="listbox" aria-label="Nationalities" hidden></div>
          </div>
          <div class="who-chips" id="who-chips"></div>
        </div>
        </div>
        <div class="filters-wrap side-filters" id="table-filters"></div>
        <button type="button" class="filter-chip" id="more-filters" aria-expanded="false" aria-controls="more-panel" hidden>Filters</button>
      </div>
    </div>
    <input type="search" id="table-search" class="table-search" placeholder="Search clubs, leagues or countries" aria-label="Search">
    <div id="table-wrap"></div>
  </section>

  <section class="panel" data-tab="stats">
    <div id="stats-side">
      <div class="side-stick"><div class="filters-wrap side-filters" id="stats-filters"></div></div>
    </div>
    <div class="filter-row range-row" id="stats-ranges">
      <button type="button" class="filter-chip" data-range="7d" aria-pressed="false">7 days</button>
      <button type="button" class="filter-chip" data-range="30d" aria-pressed="true">30 days</button>
      <button type="button" class="filter-chip" data-range="90d" aria-pressed="false">90 days</button>
      <button type="button" class="filter-chip" data-range="365d" aria-pressed="false">12 months</button>
    </div>
    <div id="stats-body"></div>
  </section>

  <section class="panel" data-tab="lineups">
    <div id="lineup-side">
      <div class="side-stick"><div class="filters-wrap side-filters" id="lineup-filters"></div></div>
    </div>
    <div class="filter-row range-row" id="lineup-source">
      <button type="button" class="filter-chip" data-source="live" aria-pressed="true" title="Predictions saved before the team sheet came out">Saved before kick-off</button>
      <button type="button" class="filter-chip" data-source="history" aria-pressed="false" title="The model re-run on every past match">Reconstructed history</button>
    </div>
    <div class="filter-row range-row" id="lineup-ranges">
      <button type="button" class="filter-chip" data-range="7" aria-pressed="false">7 days</button>
      <button type="button" class="filter-chip" data-range="30" aria-pressed="false">30 days</button>
      <button type="button" class="filter-chip" data-range="90" aria-pressed="false">90 days</button>
      <button type="button" class="filter-chip" data-range="365" aria-pressed="false">12 months</button>
      <button type="button" class="filter-chip" data-range="all" aria-pressed="true">All time</button>
    </div>
    <div id="lineup-body"></div>
  </section>

  <section class="panel" data-tab="tips">
    <div id="tips-top"></div>
    <div id="tips-body"></div>
  </section>

  <section class="panel" data-tab="bets">
    <div id="bet-side">
      <div class="side-stick"><div class="filters-wrap side-filters" id="bet-filters"></div></div>
    </div>
    <div class="filter-row range-row" id="bet-strategy">
      <button type="button" class="filter-chip" data-strategy="all" aria-pressed="true">All</button>
      <button type="button" class="filter-chip" data-strategy="early" aria-pressed="false">Night before</button>
      <button type="button" class="filter-chip" data-strategy="late" aria-pressed="false">Pre-kickoff</button>
    </div>
    <div class="filter-row u-mb8" id="bet-view">
      <button type="button" class="filter-chip" data-view="all" aria-pressed="true">All bets</button>
      <button type="button" class="filter-chip" data-view="cautious" aria-pressed="false">Cautious</button>
    </div>
    <div class="filter-row u-mb10" id="bet-market">
      <button type="button" class="filter-chip" data-market="all" aria-pressed="true">All markets</button>
      <button type="button" class="filter-chip" data-market="1X2" aria-pressed="false">Result</button>
      <button type="button" class="filter-chip" data-market="OU15" aria-pressed="false">O/U 1.5</button>
      <button type="button" class="filter-chip" data-market="OU25" aria-pressed="false">O/U 2.5</button>
      <button type="button" class="filter-chip" data-market="OU35" aria-pressed="false">O/U 3.5</button>
      <button type="button" class="filter-chip" data-market="OU45" aria-pressed="false">O/U 4.5</button>
      <button type="button" class="filter-chip" data-market="BTTS" aria-pressed="false">Both score</button>
    </div>
    <div id="bets-body"></div>
  </section>

  <section class="panel" data-tab="leagues">
    <div id="leagues-body"></div>
  </section>

  <section class="panel" data-tab="nations">
    <div id="nations-body"></div>
  </section>

  <section class="panel" data-tab="fpl">
    <div id="fpl-body"></div>
  </section>

  <section class="panel" data-tab="myteam">
    <div id="myteam-body"></div>
  </section>
  <section class="panel" data-tab="efl">
    <div id="efl-body"></div>
  </section>

  <section class="panel" data-tab="club">
    <div id="club-body"></div>
  </section>
  <footer class="freshness" id="freshness" hidden></footer>
  <footer class="site-links"><a href="methodology.html">How the models work</a> · <a href="privacy.html">Privacy, corrections &amp; security</a> · <a href="terms.html">Terms of use</a></footer>
</main>


<div class="modal-overlay" id="team-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="team-modal-title">
    <div class="modal-header">
      <div><div id="team-modal-title"></div><span class="club-sub" id="team-modal-sub"></span></div>
      <button type="button" class="modal-close" aria-label="Close">&times;</button>
    </div>
    <div id="team-modal-body"></div>
  </div>
</div>

<div class="modal-overlay" id="account-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="account-title">
    <div class="modal-header">
      <div id="account-title"></div>
      <button type="button" class="modal-close" aria-label="Close">&times;</button>
    </div>
    <div id="account-body"></div>
  </div>
</div>

<script src="assets/fpl-planner.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>

</body>
</html>
