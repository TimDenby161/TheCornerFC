name: Backfill leagues

# Manual run for newly added leagues: pulls every season's teams, fixtures, standings, match
# stats and odds, then re-ranks, re-predicts and republishes the site data. The nightly job
# only refreshes current seasons, so a new league needs this once.
on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "API-Football league ids, space-separated (e.g. 233 188)"
        required: true
      call_budget:
        description: "Maximum API attempts for this run (including preflight and retries)"
        required: true
        default: "2000"
      seasons:
        description: "Seasons (year the season starts), space-separated"
        required: true
        default: "2020 2021 2022 2023 2024 2025 2026"

concurrency:
  group: db-sync            # never overlaps the nightly or match-day jobs
  cancel-in-progress: false

# Nothing by default: each job asks for only what it needs (actions are pinned to commit SHAs,
# kept current by Dependabot)
permissions: {}

jobs:
  backfill:
    permissions:
      contents: write      # to commit the website data in docs/data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      API_DAILY_RESERVE: "200"
      API_RUN_BUDGET: ${{ inputs.call_budget }}
      THECORNERFC_MODE: production
      THECORNERFC_READ_ONLY: "false"
      THECORNERFC_NO_API: "false"
      LEAGUES: ${{ inputs.leagues }}
      SEASONS: ${{ inputs.seasons }}
    steps:
      # A run queued behind another db-sync job would otherwise check out the commit from when it
      # was queued; take the branch tip at start instead, so it builds on the last job's data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore API usage ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: api-usage-


      # Local copy of big historical query results (thecornerfc/cache.py): only weeks that
      # changed since the last run are downloaded from the database
      - name: Restore query cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}
          restore-keys: db-cache-

      - name: Pull the leagues' history from API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m thecornerfc.workflow_inputs "$LEAGUES" "$SEASONS" > /tmp/backfill-inputs.env
          source /tmp/backfill-inputs.env
          python -m thecornerfc preflight --leagues "${LEAGUE_ARGS[@]}" --seasons "${SEASON_ARGS[@]}"
          for target in leagues teams fixtures standings stats odds; do
            python -m thecornerfc sync "$target" --leagues "${LEAGUE_ARGS[@]}" --seasons "${SEASON_ARGS[@]}"
          done

      - name: Re-rank and re-predict
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m thecornerfc rank
          python -m thecornerfc predict
          python -m thecornerfc export

      - name: Commit website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update website data"
            git pull --rebase -X theirs   # on a clash, this run's freshly generated data wins
            git push
          fi

      - name: Save query cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report API usage
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc usage

      - name: Report pipeline and dataset health
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc health

      - name: Save API usage ledger
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive API usage ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .api-usage/ledger.sqlite3
