name: Daily report

# Emails the owner yesterday's visits, new accounts and paid subscribers
# (thecornerfc/pipeline/owner_report.py). Reads only: nothing is written, nothing committed, no
# API-Football calls. This repository's logs are public, so the figures go only into the email.
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC: 06:30 in winter, 07:30 in summer, UK time
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    # Production's secrets are for main only: said here, and by the production environment's own
    # branch rule (guide/environments.md)
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THECORNERFC_ENV: production      # the database must be production's, and say so
      THECORNERFC_MODE: production
      THECORNERFC_READ_ONLY: "false"   # to be given DATABASE_URL; the report's statements are read-only
      THECORNERFC_NO_API: "true"       # API-Football is not called
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Nothing is read or sent unless the unit tests pass. No secrets are given to this step.
      - name: Unit tests
        env:
          THECORNERFC_MODE: local
          THECORNERFC_READ_ONLY: "true"
          THECORNERFC_NO_API: "true"
        run: python -m unittest discover -s tests

      - name: Email the report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_REPORT_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SITE_TAG: ${{ secrets.CLOUDFLARE_SITE_TAG }}
        run: python -m thecornerfc report
