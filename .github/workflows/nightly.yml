name: Nightly sync

on:
  # GitHub's scheduler is best-effort (on 2026-10-16 the 01:17 run started about 06:00), so the
  # timer (timer/) starts this at 01:17 and these three are the back-up; each skips once one has
  # worked today (UTC).
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC
    - cron: "47 3 * * *"   # 03:47 UTC (backup)
    - cron: "17 6 * * *"   # 06:17 UTC (backup)
  workflow_dispatch:       # "Run workflow" by hand always runs; the timer passes source=timer
    inputs:
      source:
        description: "Who started it: leave blank by hand (the timer sends 'timer')"
        required: false
        default: ""

concurrency:
  group: db-sync            # shared with the match-day job so they never overlap
  cancel-in-progress: false

# Nothing by default: each job asks for only what it needs (actions are pinned to commit SHAs,
# kept current by Dependabot)
permissions: {}

jobs:
  # The timer (timer/) starts this job on the minute and GitHub's schedule above is the back-up:
  # do the work only if no other run has done it in this slot (scripts/already_ran.py). A run
  # started by hand always works.
  check:
    permissions:
      contents: read       # the script
      actions: read        # to list this workflow's runs and their jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
        run: python3 scripts/already_ran.py nightly.yml

  sync:
    needs: check
    # Production's secrets are for main only: said here, and by the production environment's own
    # branch rule. The same file on any other branch runs nothing (guide/environments.md).
    if: github.ref == 'refs/heads/main' && needs.check.outputs.run == 'true'
    permissions:
      contents: read       # the data goes to the database, nothing is committed
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_DAILY_RESERVE: "200"
      THECORNERFC_ENV: production      # the database must be production's, and say so (guide/environments.md)
      THECORNERFC_MODE: production
      THECORNERFC_READ_ONLY: "false"
      THECORNERFC_NO_API: "false"
      THECORNERFC_NATIONAL_SYNC: "true"     # national fixtures and their line-ups (about 20-40 calls a night, more on the first run)
    steps:
      # A run queued behind another db-sync job would otherwise check out the commit from when it
      # was queued; take the branch tip at start instead, so it runs the latest code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # A18 beside the base match model (thecornerfc/models/match_trees.py) needs numpy, scipy and
      # scikit-learn: the hash-pinned set the Live tracking job installs
      - run: pip install -r experiments/prospective/requirements-live.txt

      # Nothing is fetched or written unless the unit tests pass on the code this job is running.
      # No secrets are given to this step, and it runs with the local-safe settings whatever the
      # job's own are.
      - name: Unit tests
        env:
          THECORNERFC_MODE: local
          THECORNERFC_READ_ONLY: "true"
          THECORNERFC_NO_API: "true"
        run: python -m unittest discover -s tests

      - name: Restore API usage ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: api-usage-


      # Local copy of big historical query results (thecornerfc/pipeline/cache.py): only weeks that
      # changed since the last run are downloaded from the database
      - name: Restore query cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}
          restore-keys: db-cache-

      - name: Sync API-Football into Supabase
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc nightly

      # FPL prices, positions and gameweeks for the FPL tab, and last gameweek's points. Enabled by
      # the owner on 2026-09-27 (README: Fantasy Premier League evidence). Not critical: a failure
      # here never stops the export.
      - name: Capture FPL state
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FPL_CAPTURE_ENABLED: "true"
        run: |
          python -m thecornerfc fpl capture
          python -m thecornerfc fpl results

      # Publication only happens after a fully successful critical pipeline run.
      # If nightly fails, the workflow stays red and the site goes on showing the last export's rows.
      - name: Export website data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc export

      # The owner's team for My FPL team (owner's decision, 2026-09-30; README). Stored in the
      # database for the owner only, not in .export (2026-10-02, audit L3). Not critical.
      - name: My FPL team
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FPL_CAPTURE_ENABLED: "true"
        run: python -m thecornerfc fpl team

      - name: Save query cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report API usage
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc usage

      - name: Report pipeline and dataset health
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc health

      - name: Save API usage ledger
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive API usage ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .api-usage/ledger.sqlite3
