name: Nightly sync

on:
  # GitHub's scheduler is best-effort: runs on the hour are often hours late or dropped entirely.
  # So try three times, off the hour; the later attempts skip if one already succeeded today (UTC).
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC
    - cron: "47 3 * * *"   # 03:47 UTC (backup)
    - cron: "17 6 * * *"   # 06:17 UTC (backup)
  workflow_dispatch:       # "Run workflow" button for manual runs (always runs)

concurrency:
  group: db-sync            # shared with the match-day job so they never overlap
  cancel-in-progress: false

# Nothing by default: each job asks for only what it needs (actions are pinned to commit SHAs,
# kept current by Dependabot)
permissions: {}

jobs:
  # Scheduled backups do nothing if the nightly sync has already succeeded today
  check:
    permissions:
      actions: read        # to list this workflow's earlier runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          done_today=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --status success \
            --created ">=$(date -u +%F)" --json databaseId --jq length)
          if [ "$done_today" -gt 0 ]; then
            echo "Nightly sync already succeeded today; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.run == 'true'
    permissions:
      contents: write      # to commit the website data in docs/data
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_DAILY_RESERVE: "200"
      THECORNERFC_MODE: production
      THECORNERFC_READ_ONLY: "false"
      THECORNERFC_NO_API: "false"
      THECORNERFC_NATIONAL_SYNC: "true"     # national fixtures and their line-ups (about 20-40 calls a night, more on the first run)
    steps:
      # A run queued behind another db-sync job would otherwise check out the commit from when it
      # was queued; take the branch tip at start instead, so it builds on the last job's data
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore API usage ledger
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: api-usage-


      # Local copy of big historical query results (thecornerfc/cache.py): only weeks that
      # changed since the last run are downloaded from the database
      - name: Restore query cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}
          restore-keys: db-cache-

      - name: Sync API-Football into Supabase
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc nightly

      # FPL prices, positions and gameweeks for the FPL tab, and last gameweek's points. Enabled by
      # the owner on 2026-09-27 (README: Fantasy Premier League evidence). Not critical: a failure
      # here never stops the export.
      - name: Capture FPL state
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FPL_CAPTURE_ENABLED: "true"
        run: |
          python -m thecornerfc fpl capture
          python -m thecornerfc fpl results

      # Publication only happens after a fully successful critical pipeline run.
      # If nightly fails, the workflow stays red and the last committed docs/data remains live.
      - name: Export website data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc export

      # The owner's team for My FPL team (owner's decision, 2026-09-30; README). Not critical.
      - name: My FPL team
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FPL_CAPTURE_ENABLED: "true"
        run: python -m thecornerfc fpl team

      - name: Commit website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update website data"
            git pull --rebase -X theirs   # on a clash, this run's freshly generated data wins
            git push
          fi

      - name: Save query cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report API usage
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc usage

      - name: Report pipeline and dataset health
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc health

      - name: Save API usage ledger
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive API usage ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .api-usage/ledger.sqlite3
