name: C# site

# The C# site (site/, T-048) to Azure on every push: the staging branch to the staging app, main
# to the live app (thecornerfc). Every push, not only those touching site/, so each site's
# /version names the commit its branch is on, as the Staging check and the promotion expect.
# Its tests first: a failing test deploys nothing.
#
# No password is stored anywhere: GitHub proves to Azure that this is a run of this repository in
# its Staging or Production environment, and Azure lets that deploy to the two web apps only
# (site/azure/setup.sh; the app registration thecornerfc-github-deploy). The ids below name the
# account; they are not secrets.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: site-csharp-${{ github.ref_name }}
  # a newer staging push replaces one still deploying; a live deploy is never cut off
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  deploy:
    # Each branch to its own app, in its own environment, whose branch rule says the same: only
    # main may use Production, only staging Staging
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}
    permissions:
      contents: read
      id-token: write       # the token Azure checks in place of a password
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/client/package-lock.json

      # the React parts (site/client): their packages, and their own tests
      - name: React parts
        working-directory: site/client
        run: |
          npm ci --no-audit --no-fund
          npm test

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test --logger GitHubActions

      # the commit goes in with the build, for /version
      - name: Build
        run: |
          dotnet publish TheCornerFC.Web -c Release -o ../publish
          printf '{"COMMIT": "%s"}\n' "$GITHUB_SHA" > ../publish/appsettings.Production.json

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: 3c7c3d33-e141-42ef-9e46-1d2f2d192ac1
          tenant-id: 8c842454-2b22-4cdd-998e-9d4202d9f35a
          subscription-id: fe043573-e8ef-4836-85d6-5a80b8b0919b

      - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ github.ref == 'refs/heads/main' && 'thecornerfc' || 'thecornerfc-staging' }}
          package: publish
