name: Tests

# The Python unit tests and the site's unit tests and type check, on every push and pull request.
# No secrets, no database, no API. The same checks also stand in front of what deploys: the site's
# build runs its two (web/package.json, "build"), and each job that writes to the database runs
# the Python tests first (guide/architecture.md, "What gates a deploy").
on:
  push:
    branches: [main, staging]     # staging is where work lands first; main is what it is promoted to
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default: each job asks for only what it needs (actions are pinned to commit SHAs,
# kept current by Dependabot)
permissions: {}

jobs:
  python:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway Postgres for tests/test_site_access_db.py, which builds the schema on it and checks
    # who sees what (the paywall, the Admin area, the owner's FPL data, what the public key can
    # reach). Holds nothing real and goes with the job. Postgres 17, as the Supabase projects run.
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        env:
          THECORNERFC_MODE: local
          THECORNERFC_READ_ONLY: "true"
          THECORNERFC_NO_API: "true"
          SITE_DB_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
        run: python -m unittest discover -s tests

  site:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      # the timer (timer/): Node's own test runner, no packages
      - name: Timer tests
        run: node --test ../timer/src/index.test.js

      # (the type check loads the build's settings, which must name an environment)
      - name: Types
        env:
          VITE_SITE_ENV: production
        run: npm run check
