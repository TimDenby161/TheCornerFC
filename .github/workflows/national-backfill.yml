name: Backfill national teams

# Manual run for past internationals: pulls the chosen seasons of every competition in
# config.NATIONAL_TEAM_LEAGUES into national_fixtures, then the line-ups of every finished match
# not fetched yet, then rebuilds the Nations ranking. The nightly job only refreshes current seasons.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons (year the season starts), space-separated"
        required: true
        default: "2022 2023 2024 2025"
      call_budget:
        description: "Maximum API attempts for this run (about 20 per season for fixtures, plus 1 per 20 matches for line-ups)"
        required: true
        default: "600"

concurrency:
  group: db-sync            # never overlaps the nightly or match-day jobs
  cancel-in-progress: false

# Nothing by default: each job asks for only what it needs (actions are pinned to commit SHAs,
# kept current by Dependabot)
permissions: {}

jobs:
  backfill:
    # Production's secrets are for main only: said here, and by the production environment's own
    # branch rule. The same file on any other branch runs nothing (guide/environments.md).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read       # the data goes to the database, nothing is committed
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_DAILY_RESERVE: "200"
      API_RUN_BUDGET: ${{ inputs.call_budget }}
      THECORNERFC_ENV: production      # the database must be production's, and say so (guide/environments.md)
      THECORNERFC_MODE: production
      THECORNERFC_READ_ONLY: "false"
      THECORNERFC_NO_API: "false"
      SEASONS: ${{ inputs.seasons }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Nothing is fetched or written unless the unit tests pass on the code this job is running.
      # No secrets are given to this step, and it runs with the local-safe settings whatever the
      # job's own are.
      - name: Unit tests
        env:
          THECORNERFC_MODE: local
          THECORNERFC_READ_ONLY: "true"
          THECORNERFC_NO_API: "true"
        run: python -m unittest discover -s tests

      - name: Restore API usage ledger
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: api-usage-

      - name: Pull national fixtures and line-ups from API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # the league list is a placeholder: only the validated seasons are used
          python -m thecornerfc.pipeline.workflow_inputs 0 "$SEASONS" > /tmp/backfill-inputs.env
          source /tmp/backfill-inputs.env
          python -m thecornerfc sync national --seasons "${SEASON_ARGS[@]}"

      - name: Rebuild the Nations ranking
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc nations

      - name: Report API usage
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc usage

      - name: Save API usage ledger
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive API usage ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .api-usage/ledger.sqlite3
