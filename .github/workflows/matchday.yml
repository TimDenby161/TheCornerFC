name: Match day

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes; does nothing unless a match is within 3 hours
  workflow_dispatch:

concurrency:
  group: db-sync            # shared with the nightly job so they never overlap
  cancel-in-progress: false

# Nothing by default: each job asks for only what it needs (actions are pinned to commit SHAs,
# kept current by Dependabot)
permissions: {}

jobs:
  matchday:
    permissions:
      contents: write      # to commit the website data in docs/data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_DAILY_RESERVE: "200"
      THECORNERFC_MODE: production
      THECORNERFC_READ_ONLY: "false"
      THECORNERFC_NO_API: "false"
    steps:
      # A run queued behind another db-sync job would otherwise check out the commit from when it
      # was queued; take the branch tip at start instead, so it builds on the last job's data
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore API usage ledger
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: api-usage-


      - name: Pre-kickoff odds, injuries, late paper bets, settle
        run: python -m thecornerfc matchday

      - name: Commit bets and injury data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add docs/data/bets.json docs/data/injuries.json
          if ! git diff --cached --quiet; then
            git commit -m "Update paper bets and injuries"
            git pull --rebase -X theirs   # on a clash, this run's freshly generated data wins
            git push
          fi

      - name: Report API usage
        if: always()
        run: python -m thecornerfc usage

      - name: Report pipeline and dataset health
        if: always()
        run: python -m thecornerfc health

      - name: Save API usage ledger
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .api-usage
          key: api-usage-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Archive API usage ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .api-usage/ledger.sqlite3
