name: Live tracking

# How every runnable change in the model change record is doing on the matches played since
# protocol P15 began (experiments/prospective/live_p15.py; guide/admin-area.md). It reads the
# database once, works the candidates out offline and stores one document for the Admin area.
# No API-Football calls, no odds, and nothing a model or the public site reads.
on:
  schedule:
    - cron: "10 5 * * 1,4"   # Monday and Thursday, 05:10 UTC: after the nightly run and its backups
  workflow_dispatch:

concurrency:
  group: db-sync            # shared with the nightly, match-day and FPL jobs so they never overlap
  cancel-in-progress: false

# Nothing by default: each job asks for only what it needs (actions are pinned to commit SHAs,
# kept current by Dependabot)
permissions: {}

jobs:
  tracking:
    # Production's secrets are for main only: said here, and by the production environment's own
    # branch rule. The same file on any other branch runs nothing (guide/environments.md).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read       # the record goes to the database, nothing is committed
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THECORNERFC_ENV: production      # the database must be production's, and say so (guide/environments.md)
      THECORNERFC_MODE: production
      THECORNERFC_READ_ONLY: "false"
      THECORNERFC_NO_API: "true"       # no API-Football call is made by this job
    steps:
      # A run queued behind another db-sync job would otherwise check out the commit from when it
      # was queued; take the branch tip at start instead, so it runs the latest code
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # the candidates need numpy, scipy and scikit-learn at the versions they were registered with:
      # the same pins as requirements-p13.txt with everything they need, each checked by its hash
      - run: pip install -r experiments/prospective/requirements-live.txt

      # Nothing is read or written unless the unit tests pass on the code this job is running.
      # No secrets are given to this step, and it runs with the local-safe settings whatever the
      # job's own are.
      - name: Unit tests
        env:
          THECORNERFC_MODE: local
          THECORNERFC_READ_ONLY: "true"
          THECORNERFC_NO_API: "true"
        run: python -m unittest discover -s tests

      - name: Score every runnable change on the live matches and store the record
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python experiments/prospective/live_p15.py --store
