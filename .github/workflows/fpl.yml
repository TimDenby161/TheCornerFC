name: FPL update

# FPL prices, positions, status and gameweeks for the FPL tab, then the website data. No
# API-Football calls. Also part of the nightly run; this one refreshes price changes and injury
# news during the day, and can be run by hand (Actions -> FPL update -> Run workflow).
on:
  schedule:
    - cron: "0 7,13,19 * * *"   # 07:00, 13:00 and 19:00 UTC
  workflow_dispatch:

concurrency:
  group: db-sync            # shared with the nightly and match-day jobs so they never overlap
  cancel-in-progress: false

permissions:
  contents: write           # to commit the website data in docs/data

jobs:
  fpl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      THECORNERFC_MODE: production
      THECORNERFC_READ_ONLY: "false"
      THECORNERFC_NO_API: "false"     # FPL requests are external; API-Football is not called
      FPL_CAPTURE_ENABLED: "true"     # owner's decision, 2026-09-27 (README)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # The export's big historical queries come from the same local cache as the nightly run
      - name: Restore query cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}
          restore-keys: db-cache-

      - name: Capture FPL state
        run: python -m thecornerfc fpl capture

      - name: Capture FPL results
        continue-on-error: true
        run: python -m thecornerfc fpl results

      - name: Export website data
        run: python -m thecornerfc export

      - name: Commit website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Update FPL data"
            git pull --rebase
            git push
          fi

      - name: Save query cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report pipeline and dataset health
        if: always()
        run: python -m thecornerfc health
