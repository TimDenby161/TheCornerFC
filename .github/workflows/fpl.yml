name: FPL update

# FPL prices, positions, status and gameweeks for the FPL tab, then the website data. No
# API-Football calls. Also part of the nightly run; this one refreshes price changes and injury
# news during the day, and can be run by hand (Actions -> FPL update -> Run workflow).
on:
  schedule:
    - cron: "0 7,13,19 * * *"   # 07:00, 13:00 and 19:00 UTC
  workflow_dispatch:

concurrency:
  group: db-sync            # shared with the nightly and match-day jobs so they never overlap
  cancel-in-progress: false

# Nothing by default: each job asks for only what it needs (actions are pinned to commit SHAs,
# kept current by Dependabot)
permissions: {}

jobs:
  fpl:
    permissions:
      contents: read       # the data goes to the database, nothing is committed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THECORNERFC_MODE: production
      THECORNERFC_READ_ONLY: "false"
      THECORNERFC_NO_API: "false"     # FPL requests are external; API-Football is not called
      FPL_CAPTURE_ENABLED: "true"     # owner's decision, 2026-09-27 (README)
    steps:
      # A run queued behind another db-sync job would otherwise check out the commit from when it
      # was queued; take the branch tip at start instead, so it runs the latest code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # The export's big historical queries come from the same local cache as the nightly run
      - name: Restore query cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}
          restore-keys: db-cache-

      - name: Capture FPL state
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc fpl capture

      - name: Capture FPL results
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc fpl results

      - name: Export website data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc export

      # The owner's team for My FPL team (owner's decision, 2026-09-30; README). Stored in the
      # database for the owner only, not in docs/data (2026-10-02, audit L3). Not critical.
      - name: My FPL team
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc fpl team

      - name: Save query cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: db-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report pipeline and dataset health
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m thecornerfc health
